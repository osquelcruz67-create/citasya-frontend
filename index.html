  <!-- Redirect /fonts/*.ttf to jsDelivr CDN -->
  <script>
  (function() {
    var CDN = 'https://cdn.jsdelivr.net/npm/@expo/vector-icons@14/build/vendor/react-native-vector-icons/Fonts/';
    function fixURL(u) {
      if (typeof u === 'string' && /\/fonts\/[A-Za-z0-9_]+\.ttf/.test(u) && !u.startsWith('http')) {
        return CDN + u.replace(/.*\/fonts\//, '');
      }
      return u;
    }
    var _fetch0 = window.fetch;
    window.fetch = function(input, init) { return _fetch0(fixURL(input), init); };
    var _FF = window.FontFace;
    if (_FF) {
      window.FontFace = function(family, src, desc) {
        if (typeof src === 'string') src = fixURL(src);
        return new _FF(family, src, desc);
      };
      window.FontFace.prototype = _FF.prototype;
    }
  })();
  </script>

  <!-- Redirect API calls: Emergent preview -> Railway backend (persistent) -->
  <script>
  (function() {
    var EMERGENT = 'https://viralmen-hub.preview.emergentagent.com';
    var RAILWAY  = 'https://citasya-backend-production.up.railway.app';
    var API_PATHS = /^\/(api|auth|admin|push|socket|ws)[\/\?#]?/;

    function shouldRedirect(url) {
      if (typeof url !== 'string') return false;
      if (url.indexOf(EMERGENT) === -1) return false;
      var path = url.slice(EMERGENT.length);
      return API_PATHS.test(path);
    }

    function wrapFetch(fn) {
      return function(input, init) {
        if (shouldRedirect(input)) input = input.replace(EMERGENT, RAILWAY);
        return fn.apply(this, [input, init]);
      };
    }

    var intercepted = wrapFetch(window.fetch);

    try {
      Object.defineProperty(window, 'fetch', {
        get: function() { return intercepted; },
        set: function(newFn) { intercepted = wrapFetch(newFn); },
        configurable: true,
        enumerable: true
      });
    } catch(e) {
      window.fetch = intercepted;
    }

    var _open = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function(m, url, a, u, p) {
      if (shouldRedirect(url)) url = url.replace(EMERGENT, RAILWAY);
      return _open.apply(this, [m, url, a, u, p]);
    };
  })();
  </script>
