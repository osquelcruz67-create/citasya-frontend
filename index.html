  <!-- Intercept Expo Font.loadAsync() @font-face injections and redirect to CDN -->
  <script>
    (function() {
      var CDN = 'https://cdn.jsdelivr.net/npm/@expo/vector-icons@14/build/vendor/react-native-vector-icons/Fonts/';
      // Patch document.createElement to intercept style tag creation
      var origCreate = document.createElement.bind(document);
      document.createElement = function(tag) {
        var el = origCreate(tag);
        if (tag.toLowerCase() === 'style') {
          Object.defineProperty(el, 'textContent', {
            set: function(v) {
              if (typeof v === 'string' && v.indexOf('@font-face') !== -1 && v.indexOf('/fonts/') !== -1) {
                v = v.replace(/url\(['"]?(\/fonts\/[^'")]+(?:ttf|woff2))['"]?\)/ygi, function(m, p) {
                  var fname = p.replace('/fonts/', '');
                  return "url('" + CDN + fname + "')";
                });
              }
              this.innerHTML = v;
            },
            get: function() { return this.innerHTML; },
            configurable: true
          });
        }
        return el;
      };
      // MutationObserver as fallback
      var observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(m) {
          m.addedNodes.forEach(function(node) {
            if (node.nodeName === 'STYLE') {
              var txt = node.innerHTML || node.textContent || '';
              if (txt.indexOf('@font-face') !== -1 && txt.indexOf('/fonts/') !== -1) {
                var fixed = txt.replace(/url\(['"]?(\/fonts\/[^'")]+(?:ttf|woff2))['"]?\)/ygi, function(m2, p) {
                  var fname = p.replace('/fonts/', '');
                  return "url('" + CDN + fname + "')";
                });
                if (fixed !== txt) { node.innerHTML = fixed; }
              }
            }
          });
        });
      });
      observer.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
