  <!-- Redirect /fonts/*.ttf requests to jsDelivr CDN before the bundle runs -->
  <script>
  (function() {
    var CDN = 'https://cdn.jsdelivr.net/npm/@expo/vector-icons@14/build/vendor/react-native-vector-icons/Fonts/';
    function fixURL(u) {
      if (typeof u === 'string' && /\/fonts\/[A-Za-z0-9_]+\.ttf/.test(u) && !u.startsWith('http')) {
        return CDN + u.replace(/.*\/fonts\//, '');
      }
      return u;
    }
    var _fetch = window.fetch;
    window.fetch = function(input, init) { return _fetch(fixURL(input), init); };
    var _FF = window.FontFace;
    if (_FF) {
      window.FontFace = function(family, src, desc) {
        if (typeof src === 'string') src = fixURL(src);
        return new _FF(family, src, desc);
      };
      window.FontFace.prototype = _FF.prototype;
    }
  })();
  </script>
