server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;

    # API proxy to Railway backend
    location /api/ {
        proxy_pass https://backend-production-0b8c.up.railway.app/api/;
        proxy_set_header Host backend-production-0b8c.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Push notifications proxy
    location /push/ {
        proxy_pass https://backend-production-0b8c.up.railway.app/push/;
        proxy_set_header Host backend-production-0b8c.up.railway.app;
        proxy_ssl_server_name on;
    }

    # Expo asset requests for icon fonts - extract font name from query param
    location /assets/ {
        if ($arg_unstable_path ~ "Fonts/([^&/]+\.ttf)") {
            rewrite ^ /fonts/$1 last;
        }
        if ($arg_unstable_path ~ "Fonts/([^&/]+\.png)") {
            rewrite ^ /fonts/$1 last;
        }
        return 204;
    }

    # Serve fonts statically
    location /fonts/ {
        alias /usr/share/nginx/html/fonts/;
        add_header Access-Control-Allow-Origin *;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
