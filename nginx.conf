server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;

    # API proxy to Railway backend
    location /api/ {
        proxy_pass https://backend-production-0b8c.up.railway.app/api/;
        proxy_set_header Host backend-production-0b8c.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Push notifications proxy
    location /push/ {
        proxy_pass https://backend-production-0b8c.up.railway.app/push/;
        proxy_set_header Host backend-production-0b8c.up.railway.app;
        proxy_ssl_server_name on;
    }

    # Assets (fonts, icons) - proxy to Emergent
    location /assets/ {
        proxy_pass https://viralmen-hub.preview.emergentagent.com/assets/;
        proxy_set_header Host viralmen-hub.preview.emergentagent.com;
        proxy_ssl_server_name on;
        proxy_cache_valid 200 7d;
    }

    # node_modules assets - proxy to Emergent
    location /node_modules/ {
        proxy_pass https://viralmen-hub.preview.emergentagent.com/node_modules/;
        proxy_set_header Host viralmen-hub.preview.emergentagent.com;
        proxy_ssl_server_name on;
    }

    # SPA - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
