server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain application/javascript text/css application/json font/ttf application/x-font-ttf;

    # API proxy to Railway backend
    location /api/ {
        proxy_pass https://backend-production-0b8c.up.railway.app/api/;
        proxy_set_header Host backend-production-0b8c.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Push notifications proxy
    location /push/ {
        proxy_pass https://backend-production-0b8c.up.railway.app/push/;
        proxy_set_header Host backend-production-0b8c.up.railway.app;
        proxy_ssl_server_name on;
    }

    # Expo asset requests - rewrite unstable_path font/image requests to /fonts/
    location /assets/ {
        if ($arg_unstable_path ~ "Fonts/([^&/]+\.ttf)$") {
            rewrite ^ /fonts/$1 last;
        }
        if ($arg_unstable_path ~ "Fonts/([^&/]+\.png)$") {
            rewrite ^ /fonts/$1 last;
        }
        # Non-font asset requests: try serving as static file, then 204
        try_files $uri =204;
    }

    # Serve fonts statically with proper CORS and caching
    location /fonts/ {
        alias /usr/share/nginx/html/fonts/;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, immutable";
        expires 30d;
        types {
            font/ttf ttf;
        }
    }

    # SPA - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
