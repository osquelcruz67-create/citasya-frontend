server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/plain application/javascript text/css application/json font/ttf application/x-font-ttf;

    # API proxy to Railway backend
    location /api/ {
        proxy_pass https://backend-production-0b8c.up.railway.app/api/;
        proxy_set_header Host backend-production-0b8c.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    # Push notifications proxy
    location /push/ {
        proxy_pass https://backend-production-0b8c.up.railway.app/push/;
        proxy_set_header Host backend-production-0b8c.up.railway.app;
        proxy_ssl_server_name on;
    }

    # Expo asset requests - rewrite unstable_path font/image requests to /fonts/
    location /assets/ {
        if ($arg_unstable_path ~ "Fonts/([^&/]+\.ttf)$") {
            rewrite ^ /fonts/$1 last;
        }
        if ($arg_unstable_path ~ "Fonts/([^&/]+\.png)$") {
            rewrite ^ /fonts/$1 last;
        }
        # Non-font asset requests: try serving as static file, then 204
        try_files $uri =204;
    }

    # Proxy /fonts/ to jsDelivr CDN (fixes broken icons)
    location /fonts/ {
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        set $jsdelivr_host "cdn.jsdelivr.net";
        proxy_pass https://$jsdelivr_host/npm/@expo/vector-icons@14/build/vendor/react-native-vector-icons/Fonts/;
        proxy_ssl_server_name on;
        proxy_set_header Host $jsdelivr_host;
        add_header Access-Control-Allow-Origin *;
        add_header Cache-Control "public, immutable";
        proxy_cache_valid 200 30d;
        proxy_hide_header x-frame-options;
        proxy_hide_header content-security-policy;
    }

    # SPA - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
